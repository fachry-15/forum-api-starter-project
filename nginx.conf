# Terapkan limitasi 90 request per menit pada memory zone 'dicoding_forum'
limit_req_zone $binary_remote_addr zone=dicoding_forum:10m rate=90r/m;

server {
    server_name namadomainanda.com; # GANTI dengan domain/subdomain Anda

    location / {
        proxy_pass http://localhost:3000; # Port aplikasi Forum API Node.js Anda
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Blok ini menerapkan rate limit ke endpoint /threads beserta turunannya
    location /threads {
        # Menggunakan limit_req zone yang kita definisikan di atas
        limit_req zone=dicoding_forum;
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Blok di bawah ini biasanya akan diisi otomatis oleh certbot saat Anda setup HTTPS
    listen 443 ssl; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/namadomainanda.com/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/namadomainanda.com/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = namadomainanda.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name namadomainanda.com;
    return 404; # managed by Certbot
}
