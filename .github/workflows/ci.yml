name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          cat > .test.env << 'EOF'
          HOST=localhost
          PORT=3000
          PGHOST=localhost
          PGUSER=runner
          PGDATABASE=forumapi_test
          PGPASSWORD=password
          PGPORT=5432
          DATABASE_URL=postgresql://runner:password@localhost:5432/forumapi_test
          ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}
          REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY }}
          ACCESS_TOKEN_AGE=3000
          NODE_ENV=test
          EOF

      - name: Run database migrations (test)
        run: npm run migrate:test up

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
